name: Deploy staging

# Every ready-for-review PR deploys to the one shared staging environment.
# TestSprite's PR trigger listens for this workflow run completing, so it must only
# succeed once https://staging.lucidhire.io answers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lucidhire.io
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # Deploys the API, then web, then waits for staging to answer.
      - name: Deploy staging
        run: ./scripts/deploy-staging.sh
        env:
          WORKERS_CI_BRANCH: PR #${{ github.event.pull_request.number }}
          WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
