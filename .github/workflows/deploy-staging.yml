name: Deploy staging

# Every ready-for-review PR deploys to the one shared staging environment.
# TestSprite's PR trigger listens for this workflow run completing, so it must only
# succeed once https://staging.lucidhire.io answers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.lucidhire.io
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      # The web Worker's service binding needs the API Worker, so the API goes first.
      - name: Deploy API (staging)
        working-directory: apps/api
        run: pnpm exec cf deploy --mode staging --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"
      - name: Deploy web (staging)
        working-directory: apps/web
        run: pnpm exec cf deploy --mode staging --message "PR #${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}"

      - name: Wait for staging to answer
        run: |
          curl -fsS --retry 30 --retry-delay 5 --retry-all-errors --max-time 10 \
            https://staging.lucidhire.io/api/health | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --max-time 10 -o /dev/null \
            -w 'home page: %{http_code}\n' https://staging.lucidhire.io/
